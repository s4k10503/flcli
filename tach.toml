# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.config.infrastructure"
depends_on = []

[[modules]]
path = "flstudio_cli.config.presentation"
depends_on = []

# ---------------------------------------------------------------------------
# Feature: flp_cli
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.flp_cli.presentation"
depends_on = []

# ---------------------------------------------------------------------------
