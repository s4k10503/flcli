# ---------------------------------------------------------------------------
# Feature: piano_roll
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.piano_roll.domain"
depends_on = []

[[modules]]
path = "flstudio_cli.piano_roll.application"
depends_on = []

[[modules]]
path = "flstudio_cli.piano_roll.infrastructure"
depends_on = [
    # piano_roll_io.py uses the shared atomic_write_text helper; this is a
    # legitimate infra-to-infra dep (atomic write is a generic OS utility,
    # not a feature concern).
    "flstudio_cli.shared.infrastructure",
]

[[modules]]
path = "flstudio_cli.piano_roll.presentation"
depends_on = [
    "flstudio_cli.piano_roll.application",
    "flstudio_cli.piano_roll.domain",
]

# ---------------------------------------------------------------------------
# Feature: plugin
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.plugin.application"
depends_on = []

[[modules]]
path = "flstudio_cli.plugin.presentation"
depends_on = []

# ---------------------------------------------------------------------------
# Feature: project
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.project.application"
depends_on = []

[[modules]]
path = "flstudio_cli.project.presentation"
depends_on = []

# ---------------------------------------------------------------------------
# Feature: state
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.state.domain"
depends_on = []

[[modules]]
path = "flstudio_cli.state.application"
depends_on = [
    "flstudio_cli.state.domain",
]

[[modules]]
path = "flstudio_cli.state.presentation"
depends_on = [
    "flstudio_cli.state.application",
]

# state.composition lives at the feature root (one file). It composes
# state's IO-bound batch handlers with the production PianoRollIO and is
# imported only by the composition root in __main__.

# ---------------------------------------------------------------------------
# Feature: transport
# ---------------------------------------------------------------------------

[[modules]]
path = "flstudio_cli.transport.application"
depends_on = []

[[modules]]
path = "flstudio_cli.transport.presentation"
depends_on = []

# ---------------------------------------------------------------------------
# Composition root
# ---------------------------------------------------------------------------
# `__main__.py` is the single composition root. It walks entry_points to
# discover features and wires the production effects into the dispatcher,
# so it intentionally reaches into batch.application + state.composition.

[[modules]]
path = "flstudio_cli.__main__"
depends_on = [
    "flstudio_cli.batch.application",
]
