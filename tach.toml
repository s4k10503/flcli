# Architectural enforcement for flstudio_cli.
#
# Tach (https://docs.gauge.sh/) walks the import graph and rejects PRs that
# introduce dependencies not declared here, so the layered + feature-axis
# rules described in README.md can no longer drift silently.
#
# Modules are declared at depth 2 (`flstudio_cli.<feature>.<layer>`) so the
# config catches:
#   * cross-feature imports that bypass `shared/`
#   * presentation reaching into infrastructure (skipping composition)
#   * accidental circular dependencies between layers
#
# Known carve-outs are tagged `TODO(#NNN)` and wired to open issues; deleting
# the listed violation lets `tach check --exact` flag the now-unused entry.

source_roots = ["src"]

exclude = [
    "**/__pycache__",
    "**/tests",
    "**/conftest.py",
    "scripts",
]
# Note: `device_flcli.py` (FL Studio sandbox script that imports `channels`,
# `device`, `general`, ... from the embedded interpreter) is left in the walk.
# tach's walker excludes by directory only, so a per-file entry was a no-op
# for `tach check` and broke `tach show --web`. tach already tolerates the
# unresolvable sandbox imports because they don't belong to any declared
# module. ruff / pyright continue to exclude the file via their own configs.

forbid_circular_dependencies = true
exact = true
ignore_type_checking_imports = true
root_module = "ignore"

[external]
# Optional extras: pyflp (`flp` extra) and pynput (`auto-trigger` extra) are
# imported lazily inside try/except blocks so the base install stays slim.
# python-rtmidi is pulled in transitively as the rtmidi backend for `mido`,
# not imported by name in our code.
#
# `channels` / `device` / `general` / `midi` / `mixer` / `patterns` /
# `plugins` / `transport` / `ui` are FL Studio's embedded-interpreter
# modules consumed by `device_flcli.py` (which runs inside FL Studio's
# Python sandbox, never on the host). They will never appear in
# `pyproject.toml` because pip can't install them.
exclude = [
    "python_rtmidi",
    "pyflp",
    "pynput",
    "channels",
    "device",
    "general",
    "midi",
    "mixer",
    "patterns",
    "plugins",
    "transport",
    "ui",
]

# ---------------------------------------------------------------------------
# shared/ — cross-cutting modules
# ---------------------------------------------------------------------------
# Utility = true: every feature may import without listing the dep.
# `shared.infrastructure` is intentionally NOT utility so that any feature
# presentation pulling it in has to declare the dep (and gets reviewed).
#
# `shared.utility` hosts layer-free generics (the ``Ok`` / ``Err`` Outcome
# pair). It is the analogue of Rust's ``std::result`` — domain,
# application, infrastructure, and presentation may all import freely.

[[modules]]
path = "flstudio_cli.shared.utility"
utility = true
depends_on = []

[[modules]]
path = "flstudio_cli.shared.domain"
utility = true
depends_on = []

[[modules]]
path = "flstudio_cli.shared.application"
utility = true
depends_on = []

[[modules]]
path = "flstudio_cli.shared.infrastructure"
depends_on = []

[[modules]]
path = "flstudio_cli.shared.composition"
utility = true
depends_on = [
    "flstudio_cli.shared.infrastructure",
    # Composition is the single DI seam — it is allowed (and expected) to
    # reach into per-feature infrastructure / application to wire production
    # adapters into the dispatcher.
    "flstudio_cli.config.infrastructure",
    "flstudio_cli.piano_roll.infrastructure",
    "flstudio_cli.state.application",
]

[[modules]]
path = "flstudio_cli.shared.presentation"
utility = true
depends_on = []

