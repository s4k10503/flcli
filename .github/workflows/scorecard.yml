name: Scorecard supply-chain security

on:
  branch_protection_rule:
  # Weekly scan — Monday 05:23 UTC.
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
      # Uncomment the permissions below if installing in a private repository.
      # contents: read
      # actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Read-only PAT scoped to this repo with `Administration: Read` so
          # Scorecard can evaluate the Branch-Protection check. Without it
          # the check is skipped with `internal error: some github tokens
          # can't read…` and the overall score loses several points.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}
          # Publish the results for public repositories to enable scorecard badges.
          # For more details: https://github.com/ossf/scorecard-action#publishing-results
          publish_results: true

      # NOTE: upload-sarif step removed — Code Scanning is not available
      # for personal-account repos. The Scorecard badge still works via
      # publish_results: true (uses the Scorecard public API, not SARIF).
